name: Windows 11 (Secure Boot)

# Full test on a real Windows 11 with Secure Boot on and test signing off.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VirtualBatterySetup
          path: out/VirtualBatterySetup.exe

  test:
    needs: build
    name: test ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 25H2
            iso: 26200.6584.250915-1905.25h2_ge_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso
          - name: 24H2
            iso: 26100.1742.240906-0331.ge_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VirtualBatterySetup
          path: out
      - name: Prepare
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf xorriso socat imagemagick >/dev/null
          sudo mkdir -p /mnt/vbtest && sudo chmod 777 /mnt/vbtest
          ls -la /dev/kvm; df -h / /mnt; nproc; free -g
          curl -fsSL -o /mnt/vbtest/windows.iso "https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/${{ matrix.iso }}"
      - name: Test
        run: sudo TIMEOUT=4800 bash tests/vm/run.sh /mnt/vbtest/windows.iso out/VirtualBatterySetup.exe
      - name: Screenshots
        if: always()
        run: |
          cd /mnt/vbtest/shots && sudo mogrify -format png '*.ppm' && sudo rm -f ./*.ppm || true
          sudo chmod -R a+r /mnt/vbtest/shots /mnt/vbtest/serial.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-${{ matrix.name }}
          path: |
            /mnt/vbtest/shots
            /mnt/vbtest/serial.log
